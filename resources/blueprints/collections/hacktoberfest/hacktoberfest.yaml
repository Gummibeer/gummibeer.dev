title: Hacktoberfest
tabs:
  main:
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Name
              required: true
              validate:
                - required
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: image
            field:
              type: assets
              display: Image
              container: images
              folder: hacktoberfest
              restrict: true
              allow_uploads: true
              max_files: 1
  sidebar:
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - 'max:200'
                - 'new \\Statamic\\Rules\\UniqueEntryValue({collection}, {id}, {site})'
