title: 'Blog index'
tabs:
  main:
    display: Blog
    sections:
      -
        fields:
          -
            handle: eyebrow
            field:
              type: text
              display: Eyebrow
          -
            handle: heading
            field:
              type: text
              display: Heading
              validate: required
          -
            handle: intro
            field:
              type: textarea
              display: Introduction
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: seo_title
            field:
              type: text
              display: 'Page title'
          -
            handle: meta_description
            field:
              type: textarea
              display: 'Meta description'
          -
            handle: open_graph_image
            field:
              type: assets
              container: assets
              max_files: 1
              display: 'Share image'
              instructions: 'Optional. Falls back to the global share image.'
