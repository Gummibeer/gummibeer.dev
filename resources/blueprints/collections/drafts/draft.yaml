title: Draft
tabs:
  main:
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Title
              validate: required
          -
            handle: content
            field:
              type: markdown
              display: Content
          -
            handle: categories
            field:
              type: terms
              display: Categories
              taxonomies:
                - categories
              mode: select
              create: true
          -
            handle: image
            field:
              type: text
              display: Image
          -
            handle: images
            field:
              type: list
              display: Images
          -
            handle: image_credits
            field:
              type: text
              display: 'Image Credits'
          -
            handle: author
            field:
              type: entries
              display: Author
              collections:
                - authors
              max_items: 1
              mode: select
              default: gummibeer
          -
            handle: description
            field:
              type: textarea
              display: Description
          -
            handle: should_promote
            field:
              type: toggle
              display: Promote
              default: true
          -
            handle: promoted_at
            field:
              type: text
              display: 'Promoted At'
  sidebar:
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - 'max:200'
                - 'new \\Statamic\\Rules\\UniqueEntryValue({collection}, {id}, {site})'
