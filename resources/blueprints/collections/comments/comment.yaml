title: Comment
tabs:
  main:
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
              required: true
              validate:
                - required
                - 'max:100'
          -
            handle: comment
            field:
              type: textarea
              display: Comment
              required: true
              validate:
                - required
                - 'max:5000'
          -
            handle: post
            field:
              type: entries
              display: Post
              collections:
                - posts
              max_items: 1
              mode: select
              create: false
              required: true
              validate: required
  sidebar:
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
          -
            handle: date
            field:
              type: date
              required: true
              default: now
