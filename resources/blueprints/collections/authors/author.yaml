title: Author
tabs:
  main:
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Name
              validate: required
          -
            handle: nickname
            field:
              type: text
              display: Nickname
          -
            handle: email
            field:
              type: text
              input_type: email
              display: Email
          -
            handle: firstname
            field:
              type: text
              display: 'First name'
          -
            handle: lastname
            field:
              type: text
              display: 'Last name'
          -
            handle: payment_pointer
            field:
              type: text
              display: 'Payment Pointer'
          -
            handle: twitter
            field:
              type: text
              display: Twitter
  sidebar:
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate:
                - 'max:200'
                - 'new \\Statamic\\Rules\\UniqueEntryValue({collection}, {id}, {site})'
