    handle: name
    field:
      type: text
      display: Name
      required: true
      validate: required
  -
    handle: email
    field:
      type: text
      input: email
      display: Email Address
  -
    handle: slug
    field:
      type: text
      display: Slug
  -
    handle: nickname
    field:
      type: text
      display: Nickname
