    handle: firstname
    field:
      type: text
      display: 'First name'
  -
    handle: lastname
    field:
      type: text
      display: 'Last name'
  -
    handle: roles
    field:
      type: user_roles
      width: 50
  -
    handle: groups
    field:
      type: user_groups
      width: 50
