name: format-debug

on:
  push:
    branches:
      - feature/stream-content-pages

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write resources/views/components/text-file.blade.php resources/views/pages/streams/show.blade.php
      - run: git diff -- resources/views/components/text-file.blade.php resources/views/pages/streams/show.blade.php
