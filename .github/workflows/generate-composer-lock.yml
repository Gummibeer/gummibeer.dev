name: generate composer lock

on:
  push:
    branches:
      - statamic-cms

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skip when lockfile exists
        id: lockfile
        run: |
          if [ -f composer.lock ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.lockfile.outputs.exists == 'false'
        with:
          php-version: 8.3
          extensions: dom, curl, intl, libxml, mbstring, simplexml, zip, imagick
          tools: composer:v2

      - if: steps.lockfile.outputs.exists == 'false'
        run: composer update --no-progress --prefer-dist --no-interaction --no-scripts

      - if: steps.lockfile.outputs.exists == 'false'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "Lock Composer dependencies"
          git push
