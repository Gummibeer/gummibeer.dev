name: bootstrap-pixpipe

on:
  push:
    branches:
      - statamic-cms

permissions:
  contents: write

jobs:
  lock:
    if: github.event.head_commit.message == 'Bootstrap PixPipe lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - run: composer update astrotomic/pixpipe league/glide intervention/image intervention/image-laravel statamic/cms --with-all-dependencies --no-interaction --no-scripts

      - run: composer validate --strict

      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "Update Composer lock for PixPipe"
          git push
