name: Update schema lock

on:
  push:
    branches:
      - orank/schema-org-identity

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
      - run: composer update spatie/schema-org --with-dependencies --no-interaction --no-progress --no-scripts
      - run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "Update Composer lock"
          git push
