name: patch frontend modernization

on:
  push:
    branches:
      - statamic-cms

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: statamic-cms

      - name: Patch migration workflow
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/modernize-frontend.yml')
          value = path.read_text()

          value = value.replace('''          @import "mburger-css";\n''', '')
          value = value.replace('''          :root {\n            --mb-button-size: 3rem;\n            --mb-bar-height: 2px;\n            --mb-bar-spacing: 0.5rem;\n            --mb-animate-timeout: 0s;\n          }\n\n''', '')
          value = value.replace("              'private': True,\n", "              'private': True,\n              'type': 'module',\n")
          value = value.replace('''                      value = value.replace('mix(', 'asset(')\n                      value = value.replace("'fal ", "'fa-solid ")\n                      value = value.replace('"fal ', '"fa-solid ')\n''', '''                      value = value.replace('mix(', 'asset(')\n                      value = value.replace("'fal ", "'fa-solid ")\n                      value = value.replace('"fal ', '"fa-solid ')\n                      for old, new in {\n                          'flex-no-wrap': 'flex-nowrap',\n                          'flex-no-shrink': 'shrink-0',\n                          'flex-no-grow': 'grow-0',\n                          'flex-shrink': 'shrink',\n                          'flex-grow': 'grow',\n                          'whitespace-no-wrap': 'whitespace-nowrap',\n                          'overflow-ellipsis': 'text-ellipsis',\n                      }.items():\n                          value = value.replace(old, new)\n''')
          value = value.replace('''          mburger-css@latest\n''', '')
          value = value.replace("""          if git grep -nE 'laravel-mix|webpack\\.mix|tailwind\\.config|resources/scss' -- ':!content/**'; then\n            echo 'Legacy frontend tooling remains.' >&2\n            exit 1\n          fi\n""", """          if [ -e webpack.mix.js ] || [ -e tailwind.config.js ] || [ -d resources/scss ] || grep -q 'laravel-mix' package.json; then\n            echo 'Legacy frontend tooling remains.' >&2\n            exit 1\n          fi\n""")
          value = value.replace("""          if git grep -nE 'aspect-w-|aspect-h-|flex-no-wrap|flex-no-shrink|flex-no-grow|whitespace-no-wrap|overflow-ellipsis' -- resources/views; then\n""", """          if git grep -nE 'aspect-w-|aspect-h-|flex-no-wrap|flex-no-shrink|flex-no-grow|flex-shrink|flex-grow|whitespace-no-wrap|overflow-ellipsis' -- resources/views; then\n""")

          path.write_text(value)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-modernize-frontend.yml
          git add .github/workflows/modernize-frontend.yml
          git commit -m 'Harden frontend modernization workflow'
          git push origin HEAD:statamic-cms
