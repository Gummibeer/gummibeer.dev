name: Resolve Statamic lockfile

on:
  push:
    branches:
      - statamic-cms

permissions:
  contents: write

jobs:
  composer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: statamic-cms

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, imagick
          tools: composer:v2

      - run: composer update --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet || git commit -m "Update Composer lockfile for Statamic"
          git push
