name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, intl, libxml, mbstring, simplexml, zip, imagick
          tools: composer:v2

      - run: composer validate --strict

      - run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - run: find app routes config -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: php artisan route:list

      - run: php please stache:warm

      - name: Verify migrated collections
        run: |
          php <<'PHP'
          <?php

          require 'vendor/autoload.php';

          $app = require 'bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          foreach (['posts', 'streams', 'jobs', 'hacktoberfest', 'static'] as $collection) {
              $count = Statamic\Facades\Entry::whereCollection($collection)->count();
              echo "{$collection}: {$count}\n";

              if ($count === 0) {
                  fwrite(STDERR, "Collection [{$collection}] is empty.\n");
                  exit(1);
              }
          }
          PHP

      - run: php artisan view:cache

      - name: Smoke test HTTP routes
        run: |
          cat > public/mix-manifest.json <<'JSON'
          {
            "/css/app.css": "/css/app.css",
            "/js/app.js": "/js/app.js",
            "/images/og/static/home.png": "/images/og/static/home.png",
            "/images/og/static/blog.png": "/images/og/static/blog.png",
            "/images/og/static/me.png": "/images/og/static/me.png",
            "/images/og/static/uses.png": "/images/og/static/uses.png",
            "/images/og/static/charity.png": "/images/og/static/charity.png",
            "/images/og/static/portfolio.png": "/images/og/static/portfolio.png"
          }
          JSON

          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/gummibeer-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for path in / /resume /privacy /blog/search.json /cp/auth/login; do
            curl --fail --silent --show-error --max-time 20 --retry 5 --retry-connrefused "http://127.0.0.1:8000${path}" > /dev/null || {
              cat /tmp/gummibeer-server.log
              exit 1
            }
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: laravel-log
          path: storage/logs/laravel.log
