name: prettier

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes prettier@3.6.2 --check 'README.md' 'resources/content/**/*.md' 'resources/js/*.js' 'resources/scss/**/*.scss'
