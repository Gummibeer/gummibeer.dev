name: update-turnstile-lock

on:
  push:
    branches:
      - feature/statamic-comments

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
      - run: composer update laragear/turnstile --with-dependencies --no-scripts --no-interaction
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git diff --cached --quiet || git commit -m "Update Composer lockfile"
          git push origin HEAD:feature/statamic-comments
