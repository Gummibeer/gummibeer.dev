name: csp-lock

on:
  push:
    branches:
      - csp

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: csp
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
      - run: composer update spatie/laravel-csp --with-dependencies --minimal-changes --no-install --no-scripts --no-interaction --no-progress
      - run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "Update Composer lock"
          git push origin HEAD:csp
