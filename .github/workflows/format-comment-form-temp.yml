name: format-comment-form-temp

on:
  push:
    branches:
      - feature/statamic-comments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write resources/views/components/comments/form.blade.php
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/views/components/comments/form.blade.php
          git diff --cached --quiet || git commit -m "Format comment form"
          git push origin HEAD:feature/statamic-comments
