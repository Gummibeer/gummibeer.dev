name: modernize frontend

on:
  push:
    branches:
      - statamic-cms

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: statamic-cms
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Migrate frontend sources
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import shutil

          root = Path('.')

          # Static runtime images belong in public/. Mix only copied these during builds.
          source_images = root / 'resources/images'
          public_images = root / 'public/images'
          if source_images.exists():
              if public_images.exists():
                  shutil.rmtree(public_images)
              shutil.move(str(source_images), str(public_images))

          shutil.rmtree(root / 'resources/scss', ignore_errors=True)
          for legacy in ['webpack.mix.js', 'tailwind.config.js']:
              path = root / legacy
              if path.exists():
                  path.unlink()

          (root / 'resources/css').mkdir(parents=True, exist_ok=True)
          (root / 'resources/css/app.css').write_text(r'''@import "tailwindcss";
          @import "@fontsource-variable/inter";
          @import "@fontsource-variable/fira-code";
          @import "@fontsource/permanent-marker/400.css";
          @import "@fortawesome/fontawesome-free/css/all.css";
          @import "mburger-css";
          @import "prism-themes/themes/prism-material-light.css";
          @import "prism-themes/themes/prism-material-dark.css" (prefers-color-scheme: dark);

          @plugin "@tailwindcss/typography";

          @theme {
            --font-sans: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
            --font-mono: "Fira Code Variable", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            --font-logo: "Permanent Marker", cursive;

            --color-black: #000000;
            --color-white: #ffffff;
            --color-brand: #ffb300;
            --color-snow-20: #88888e;
            --color-snow-10: #dedddd;
            --color-snow-0: #fafafa;
            --color-night-20: #070615;
            --color-night-10: #12152b;
            --color-night-0: #161b2a;

            --shadow-light: rgb(184 194 215 / 25%) 0 4px 6px, rgb(184 194 215 / 10%) 0 5px 7px;
            --shadow-dark: rgb(15 17 21 / 25%) 0 4px 6px, rgb(15 17 21 / 10%) 0 5px 7px;

            --radius-0: 0;
            --radius-1: 0.25rem;
            --radius-2: 0.5rem;
            --radius-3: 0.75rem;
            --radius-4: 1rem;
            --radius-full: 100%;

            --container-xs: 20rem;
            --container-md: 24rem;
            --container-lg: 32rem;
            --container-xl: 36rem;
            --container-2xl: 42rem;
          }

          @custom-variant light (@media (prefers-color-scheme: light));
          @custom-variant print (@media print);

          @utility list-square {
            list-style-type: square;
          }

          @utility list-roman {
            list-style-type: upper-roman;
          }

          .prose {
            color: inherit;
            --tw-prose-body: currentColor;
            --tw-prose-headings: currentColor;
            --tw-prose-lead: currentColor;
            --tw-prose-links: currentColor;
            --tw-prose-bold: currentColor;
            --tw-prose-counters: currentColor;
            --tw-prose-bullets: currentColor;
            --tw-prose-hr: currentColor;
            --tw-prose-quotes: currentColor;
            --tw-prose-quote-borders: currentColor;
            --tw-prose-captions: currentColor;
            --tw-prose-code: currentColor;
            --tw-prose-pre-code: currentColor;

            & :where(strong):not(:where([class~="not-prose"], [class~="not-prose"] *)) {
              font-weight: 700;
            }

            & :where(a):not(:where([class~="not-prose"], [class~="not-prose"] *)) {
              color: inherit;
              border-bottom: 2px dashed var(--color-brand);
              text-decoration: none;
              font-weight: 500;

              &:hover {
                color: var(--color-brand);
                border-bottom-style: solid;
              }
            }

            & :where(ul > li)::marker {
              color: var(--color-night-0);
            }
          }

          .prose-xl :where(ul > li):not(:where([class~="not-prose"], [class~="not-prose"] *)) {
            margin-block: 0.25em;
          }

          @media (prefers-color-scheme: dark) {
            .prose :where(ul > li)::marker {
              color: var(--color-snow-0);
            }
          }

          .markdown {
            & a[href]:not([class]) {
              @apply border-b-2 border-brand border-dashed;

              &:hover {
                @apply border-solid;
              }
            }

            & h1:not([class]) {
              @apply mb-8 text-5xl leading-none font-black text-night-0;
            }

            & h2:not([class]) {
              @apply mt-8 mb-4 text-4xl leading-none font-bold text-night-0;
            }

            & p:not([class]),
            & blockquote:not([class]) {
              @apply mb-2;
            }

            & pre:not([class]),
            & pre[class*="language-"] {
              @apply m-0;
            }

            & ul:not([class]) {
              @apply mb-4 list-inside;
              list-style-type: square;

              & li:not([class]) {
                @apply mb-2;
              }
            }
          }

          @media (prefers-color-scheme: dark) {
            .markdown h1:not([class]),
            .markdown h2:not([class]) {
              @apply text-white;
            }
          }

          code[class*="language-"],
          pre[class*="language-"] {
            @apply font-mono text-base leading-loose;
            background: transparent;
            tab-size: 4;
            hyphens: none;
          }

          pre[class*="language-"].line-numbers {
            position: relative;
            padding-left: 3.8em;
            counter-reset: linenumber;
          }

          pre[class*="language-"].line-numbers > code {
            position: relative;
            white-space: inherit;
          }

          .line-numbers .line-numbers-rows {
            position: absolute;
            pointer-events: none;
            top: 0;
            font-size: 100%;
            left: -3.8em;
            width: 3em;
            letter-spacing: -1px;
            border-right: 1px solid #999;
            user-select: none;
          }

          .line-numbers-rows > span {
            display: block;
            counter-increment: linenumber;
          }

          .line-numbers-rows > span::before {
            content: counter(linenumber);
            color: #999;
            display: block;
            padding-right: 0.8em;
            text-align: right;
          }

          :root {
            --mb-button-size: 3rem;
            --mb-bar-height: 2px;
            --mb-bar-spacing: 0.5rem;
            --mb-animate-timeout: 0s;
          }

          img.emoji {
            display: inline-block;
            font-size: 1em;
            line-height: 1;
            height: 1em;
            width: 1em;
            margin: 0 0.1em !important;
          }

          .flex-basis-full {
            flex-basis: 100%;
          }

          .shadow {
            box-shadow: var(--shadow-light);
          }

          @media (prefers-color-scheme: dark) {
            .shadow {
              box-shadow: var(--shadow-dark);
            }
          }

          .hover\:underlined {
            background-image: linear-gradient(90deg, rgb(255 179 0 / 75%), rgb(255 179 0 / 75%));
            background-repeat: no-repeat;
            background-position: left bottom;
            background-size: 100% 10%;
            transition-property: background-size, background-image;
            transition-duration: 250ms;
            transition-timing-function: ease-out;

            @media (prefers-reduced-motion: reduce) {
              transition-duration: 750ms;
              transition-timing-function: linear;
            }

            &:hover {
              background-image: linear-gradient(90deg, var(--color-brand), var(--color-brand));
              background-size: 100% 30%;
            }
          }

          .bg-dotted {
            background-position: 0;
            background-size: 10px 10px;
            background-repeat: repeat;
            background-image: radial-gradient(rgb(0 0 0 / 25%) 0.5px, transparent 0.5px);
          }

          .bg-dotted-lg {
            background-position: 0;
            background-size: 10px 10px;
            background-repeat: repeat;
            background-image: radial-gradient(rgb(0 0 0 / 25%) 1px, transparent 1px);
          }

          @media (prefers-color-scheme: dark) {
            .bg-dotted {
              background-image: radial-gradient(rgb(255 255 255 / 25%) 0.5px, transparent 0.5px);
            }

            .bg-dotted-lg {
              background-image: radial-gradient(rgb(255 255 255 / 25%) 1px, transparent 1px);
            }
          }

          a[href] {
            cursor: pointer;
            transition-property: all;
            transition-duration: 250ms;
            transition-timing-function: ease-out;

            @media (prefers-reduced-motion: reduce) {
              transition-duration: 500ms;
              transition-timing-function: linear;
            }
          }

          [x-cloak]:not([class*="x-cloak"]) {
            display: none;
          }

          @media (max-width: 639px) {
            [x-cloak].x-cloak {
              display: none;
            }
          }

          @media (min-width: 640px) and (max-width: 767px) {
            [x-cloak].x-cloak:not(.sm\:-x-cloak),
            [x-cloak].sm\:x-cloak {
              display: none;
            }
          }

          @media (min-width: 768px) and (max-width: 1023px) {
            [x-cloak].x-cloak:not(.md\:-x-cloak),
            [x-cloak].sm\:x-cloak:not(.md\:-x-cloak),
            [x-cloak].md\:x-cloak {
              display: none;
            }
          }

          @media (min-width: 1024px) and (max-width: 1279px) {
            [x-cloak].x-cloak:not(.lg\:-x-cloak),
            [x-cloak].sm\:x-cloak:not(.lg\:-x-cloak),
            [x-cloak].md\:x-cloak:not(.lg\:-x-cloak),
            [x-cloak].lg\:x-cloak {
              display: none;
            }
          }

          @media (min-width: 1280px) {
            [x-cloak].x-cloak:not(.xl\:-x-cloak),
            [x-cloak].sm\:x-cloak:not(.xl\:-x-cloak),
            [x-cloak].md\:x-cloak:not(.xl\:-x-cloak),
            [x-cloak].lg\:x-cloak:not(.xl\:-x-cloak),
            [x-cloak].xl\:x-cloak {
              display: none;
            }
          }

          ::selection {
            background: var(--color-brand);
            color: var(--color-white);
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          (root / 'resources/js/app.js').write_text(r'''import Alpine from "alpinejs";
          import ClipboardJS from "clipboard";
          import Prism from "prismjs";
          import "prismjs/components/prism-markup-templating";
          import "prismjs/components/prism-php";
          import "prismjs/components/prism-ini";
          import "prismjs/components/prism-scss";
          import "prismjs/plugins/line-numbers/prism-line-numbers";
          import twemoji from "@twemoji/api";

          Alpine.data("slider", (delay = 3) => ({
            delay: delay * 1000,
            images: [],
            index: 0,
            init() {
              this.images = Array.from(this.$el.getElementsByTagName("img"));
              this.render();

              window.setInterval(() => this.next(), this.delay);
            },
            next() {
              this.index = this.index < this.images.length - 1 ? this.index + 1 : 0;
              this.render();
            },
            render() {
              this.images.forEach((image, index) => {
                image.classList.toggle("hidden", index !== this.index);
              });
            },
          }));

          window.Alpine = Alpine;
          Alpine.start();

          Prism.highlightAll();
          new ClipboardJS("button[data-clipboard-text]");

          window.search = {
            query: "",
            results: [],
            search() {
              const url = new URL("https://search.gummibeer.dev");
              url.searchParams.set("q", this.query);
              url.searchParams.set("t", Date.now());

              fetch(url)
                .then((response) => response.json())
                .then((results) => {
                  this.results = results
                    .toSorted((a, b) => a.score - b.score)
                    .slice(0, 3)
                    .map(({ item }) => item);
                });
            },
          };

          window.twemoji = (content) => twemoji.parse(content, { folder: "svg", ext: ".svg" });
          window.twemoji(document.body);
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          (root / 'vite.config.js').write_text(r'''import { defineConfig } from "vite";
          import laravel from "laravel-vite-plugin";
          import tailwindcss from "@tailwindcss/vite";

          export default defineConfig({
            plugins: [
              laravel({
                input: ["resources/css/app.css", "resources/js/app.js"],
                refresh: true,
              }),
              tailwindcss(),
            ],
          });
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Laravel's modern Vite integration owns CSS/JS tags. Static images use asset().
          web = root / 'resources/views/web.blade.php'
          text = web.read_text(encoding='utf-8')
          text = text.replace('    <link rel="dns-prefetch" href="{{ config(\'app.asset_url\') }}" id="ASSET_URL">\n', '')
          text = text.replace('    <link href="{{ mix(\'css/app.css\') }}" rel="stylesheet" crossorigin="anonymous">', '    @vite([\'resources/css/app.css\', \'resources/js/app.js\'])')
          text = text.replace('\n<script defer src="{{ mix(\'js/app.js\') }}" crossorigin="anonymous"></script>', '')
          web.write_text(text, encoding='utf-8')

          for base in [root / 'app', root / 'routes', root / 'resources/views']:
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix in {'.php'}:
                      value = path.read_text(encoding='utf-8')
                      value = value.replace('mix(', 'asset(')
                      value = value.replace("'fal ", "'fa-solid ")
                      value = value.replace('"fal ', '"fa-solid ')
                      path.write_text(value, encoding='utf-8')

          # The old aspect-ratio plugin is obsolete in Tailwind v4; Alpine v3 uses named data components.
          image_view = root / 'resources/views/components/post/image.blade.php'
          value = image_view.read_text(encoding='utf-8')
          value = value.replace('aspect-w-16 aspect-h-9', 'aspect-video')
          value = value.replace('x-data="window.components.slider(3)" x-init="init"', 'x-data="slider(3)"')
          image_view.write_text(value, encoding='utf-8')

          # PHP-rendered Twemoji follows the maintained jdecked Twemoji asset CDN now that Mix no longer copies node_modules.
          twemoji_view = root / 'resources/views/components/twemoji.blade.php'
          if twemoji_view.exists():
              value = twemoji_view.read_text(encoding='utf-8')
              value = value.replace("base(asset('vendor/twemoji'))", "base('https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets')")
              twemoji_view.write_text(value, encoding='utf-8')

          # Vite can be disabled natively in tests; no fake Mix manifest is needed.
          (root / 'tests/TestCase.php').write_text(r'''<?php

          namespace Tests;

          use Illuminate\Foundation\Testing\TestCase as BaseTestCase;

          abstract class TestCase extends BaseTestCase
          {
              use CreatesApplication;

              protected function setUp(): void
              {
                  parent::setUp();

                  $this->withoutVite();
              }
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          composer = root / 'composer.json'
          data = json.loads(composer.read_text(encoding='utf-8'))
          scripts = data.setdefault('scripts', {})
          if 'og' in scripts:
              scripts['og'] = '@php artisan generate:og:images && npm run build'
          if 'alex' in scripts:
              scripts['alex'] = 'npm run lint:prose'
          composer.write_text(json.dumps(data, indent=4) + '\n', encoding='utf-8')

          package = {
              'private': True,
              'scripts': {
                  'build': 'vite build',
                  'dev': 'vite',
                  'format': "prettier --write 'package.json' 'vite.config.js' 'resources/js/**/*.js' 'resources/css/**/*.css'",
                  'format:check': "prettier --check 'package.json' 'vite.config.js' 'resources/js/**/*.js' 'resources/css/**/*.css'",
                  'lint:prose': "alex 'content/collections/**/*.md'",
              },
              'devDependencies': {},
          }
          (root / 'package.json').write_text(json.dumps(package, indent=4) + '\n', encoding='utf-8')

          gitignore = root / '.gitignore'
          lines = gitignore.read_text(encoding='utf-8').splitlines()
          lines = [line for line in lines if line not in {'package-lock.json', '/public/hot/'}]
          for line in ['/public/build/', '/public/hot']:
              if line not in lines:
                  lines.insert(1, line)
          gitignore.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          (root / '.github/workflows/prettier.yml').write_text(r'''name: prettier

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            prettier:
              runs-on: ubuntu-latest
              timeout-minutes: 5

              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run format:check
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          (root / '.github/workflows/frontend.yml').write_text(r'''name: frontend

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 5

              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-node@v7
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - run: npm run build
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          dependabot = root / '.github/dependabot.yml'
          value = dependabot.read_text(encoding='utf-8')
          if "package-ecosystem: 'npm'" not in value:
              value += "\n  - package-ecosystem: 'npm'\n    directory: '/'\n    schedule:\n      interval: 'daily'\n    open-pull-requests-limit: 10\n    reviewers:\n      - 'Gummibeer'\n"
          dependabot.write_text(value, encoding='utf-8')
          PY

      - name: Install current frontend dependencies
        run: >-
          npm install --save-dev
          @fortawesome/fontawesome-free@latest
          @fontsource-variable/fira-code@latest
          @fontsource-variable/inter@latest
          @fontsource/permanent-marker@latest
          @tailwindcss/typography@latest
          @tailwindcss/vite@latest
          @twemoji/api@latest
          alex@latest
          alpinejs@latest
          clipboard@latest
          laravel-vite-plugin@latest
          mburger-css@latest
          prettier@latest
          prism-themes@latest
          prismjs@latest
          tailwindcss@latest
          vite@latest

      - name: Format frontend files
        run: npm run format

      - name: Validate migration
        run: |
          npm run format:check
          npm run build
          if git grep -n 'mix(' -- app routes resources/views tests; then
            echo 'Laravel Mix usage remains.' >&2
            exit 1
          fi
          if git grep -nE 'laravel-mix|webpack\.mix|tailwind\.config|resources/scss' -- ':!content/**'; then
            echo 'Legacy frontend tooling remains.' >&2
            exit 1
          fi
          if git grep -nE 'aspect-w-|aspect-h-|flex-no-wrap|flex-no-shrink|flex-no-grow|whitespace-no-wrap|overflow-ellipsis' -- resources/views; then
            echo 'Legacy Tailwind utility names remain.' >&2
            exit 1
          fi

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/modernize-frontend.yml
          git add -A
          git commit -m 'Modernize frontend with Vite and Tailwind CSS 4'
          git push origin HEAD:statamic-cms
