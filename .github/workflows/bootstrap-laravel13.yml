name: bootstrap-laravel13

on:
  push:
    branches:
      - statamic-cms

permissions:
  contents: write

jobs:
  lock:
    if: github.event.head_commit.message == 'Bootstrap Laravel 13 lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, intl, libxml, mbstring, simplexml, zip, imagick
          coverage: none

      - run: composer update --with-all-dependencies --no-interaction --no-scripts
      - run: composer validate --strict

      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.lock
          git commit -m "Update Composer lock for Laravel 13"
          git push
