name: restore-images

on:
  push:
    branches:
      - statamic-cms
    paths:
      - .github/workflows/restore-images.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: statamic-cms
          fetch-depth: 0
      - name: Restore original image assets
        run: |
          git fetch origin master
          git checkout origin/master -- resources/images
          rm -rf public/images
          mkdir -p public
          mv resources/images public/images

          while read -r mode type sha path; do
            target="public/${path#resources/}"
            actual="$(git hash-object "$target")"

            if [ "$actual" != "$sha" ]; then
              echo "Blob mismatch: $path -> $target"
              exit 1
            fi
          done < <(git ls-tree -r origin/master -- resources/images)

          git add -A public/images resources/images

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Restore images as Statamic assets"
          git push origin HEAD:statamic-cms
