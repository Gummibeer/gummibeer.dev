name: Deploy

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 16

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, imagick
          tools: composer:v2

      - run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - run: |
          npm config set "@fortawesome:registry" https://npm.fontawesome.com/
          npm config set "//npm.fontawesome.com/:_authToken" ${{ secrets.FONTAWESOME_TOKEN }}
          yarn install

      - run: yarn production

      - run: php artisan stats:strava
        env:
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      - run: php please stache:warm
        env:
          APP_ENV: production
          APP_URL: https://gummibeer.dev

      - run: php please ssg:generate
        env:
          APP_ENV: production
          APP_URL: https://gummibeer.dev
          IMGIX_SIGN_KEY: ${{ secrets.IMGIX_SIGN_KEY }}
          WEBMENTION_TOKEN: ${{ secrets.WEBMENTION_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: laravel-log
          path: storage/logs/laravel.log

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: static-site
          path: storage/app/static

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://gummibeer.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: storage/app/static

      - run: |
          yarn global add netlify-cli@^3.0.0
          "$(yarn global bin)/netlify" deploy --prod --dir storage/app/static --message "${GITHUB_SHA::8}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
